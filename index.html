<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Álbum del Mundial</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>Álbum de figuritas del Mundial</h1>
        <p class="subtitle">Colecciona cromos mock y controla tus faltantes, rarezas y sobrantes.</p>
      </div>
      <section class="stats-row">
        <div class="stat-card">
          <span class="stat-label">Coleccionados</span>
          <strong id="collected-count">0</strong>
          <span id="total-count">0</span>
        </div>
        <div class="stat-card progress-card">
          <span class="stat-label">Progreso</span>
          <div class="progress-bar" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <strong id="progress-label">0%</strong>
        </div>
      </section>
    </header>

    <section class="controls-panel">
      <div class="control-group">
        <label for="rarity-filter">Filtrar rareza</label>
        <select id="rarity-filter">
          <option value="all">Todas</option>
          <option value="comun">Común</option>
          <option value="rara">Rara</option>
          <option value="epica">Épica</option>
        </select>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="missing-only" />
        Solo faltantes
      </label>

      <button id="open-pack" class="primary-button">Abrir pack</button>
      <button id="reset-button" class="secondary-button">Reiniciar colección</button>
    </section>

    <section id="pack-result" class="pack-result hidden" aria-live="polite"></section>

    <section id="grid" class="cromo-grid" aria-label="Grid de cromos"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
